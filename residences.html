  <header id="top">
    <a id="mark" href="#/" aria-label="The Pavilions Anambas Residences: back to the start">
      <span class="mark-a">The Pavilions</span><span class="mark-b">Anambas</span><span class="mark-c">Residences</span>
    </a>
    <div id="tools">
      <p id="clock" title="The time on the islands right now"><span id="clock-time">--:--</span> on Tenggeran now</p>
      <div id="pace" role="group" aria-label="How you want to see it">
        <button type="button" data-pace="watch" title="The journey plays by itself, like a film. Press again to pause."><span>Play</span></button>
        <button type="button" data-pace="guided" aria-pressed="true" title="You move from stop to stop with Next and Back"><span class="wide">Step by step</span><span class="narrow">Steps</span></button>
        <button type="button" data-pace="explore" title="Move round the islands freely, like a map"><span>Explore</span></button>
      </div>
      <button type="button" id="sound" aria-pressed="false">Sound off</button>
      <button type="button" id="voice" aria-pressed="false" title="A spoken commentary at every stop">Voice off</button>
      <button type="button" id="cc" aria-pressed="false" title="The commentary as text">Captions off</button>
      <button type="button" id="short" hidden></button>
      <button type="button" id="talk" class="btn btn-solid"><span class="wide">Talk to us</span><span class="narrow">Talk</span></button>
    </div>
  </header>

  <div id="labels" aria-hidden="false"></div>

  <section id="card" aria-live="polite">
    <button type="button" id="card-fold" aria-expanded="true" aria-label="Fold the card"><i></i></button>

      <p id="card-hour"></p>
      <p id="card-greet" hidden></p>
      <h1 id="card-title"></h1>
      <div id="card-text"></div>
      <div id="card-body"></div>
    </div>
    <p id="card-auto" aria-live="off" hidden></p>
    <div id="card-actions">
      <button type="button" id="prev" class="btn btn-ghost" aria-label="Previous stop">Back</button>
      <button type="button" id="next" class="btn btn-solid"></button>
    </div>
    <div id="card-progress" aria-hidden="true"><i></i></div>
  </section>

  <section id="explore" hidden>
    <p>Drag to slide the island. Scroll or pinch to zoom. Hold Shift and drag to turn.</p>
    <div>
      <button type="button" class="btn btn-ghost" data-do="walk">Walk the island</button>
      <button type="button" class="btn btn-ghost" data-do="snorkel">Snorkel the reef</button>
      <button type="button" class="btn btn-ghost" data-do="plane">Explore by our seaplane</button>
      <button type="button" class="btn btn-ghost" data-do="boat">Explore by our boat</button>
      <button type="button" class="btn btn-solid" data-do="journey">Back to the journey</button>
    </div>
  </section>

  <section id="handover" hidden>
    <p id="handover-text"></p>
    <button type="button" class="btn btn-solid" data-do="leave">Back to the journey</button>
  </section>

  <nav id="arc" aria-label="The journey, one day on the island"></nav>
  <p id="captions" aria-live="off" hidden></p>

  <div id="toast" role="status" aria-live="polite" hidden></div>

  <aside id="sheet" hidden aria-label="Residence"></aside>
  <div id="dialog" hidden role="dialog" aria-modal="true" aria-labelledby="dialog-title"></div>
  <div id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Picture"></div>

  <div id="veil">
    <div id="veil-inner">
      <p class="mark-a">The Pavilions</p>
      <p class="mark-b">Anambas</p>
      <p class="mark-c">Residences</p>
      <p id="veil-line">Bringing the islands up</p>
      <div id="veil-bar" aria-hidden="true"><i></i></div>
    </div>
